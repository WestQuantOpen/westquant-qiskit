name: Nightly SDK Breakage Detection

# Installs the newest releases of every dependency and fails visibly when the
# install, dependency resolution or tests break. Do not add continue-on-error,
# "|| true" or "|| echo" here: a red nightly run is the signal.
on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

jobs:
  nightly:
    name: Test against latest SDK versions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Checkout WestQuant Core main
        uses: actions/checkout@v4
        with:
          repository: WestQuantOpen/westquant-core
          path: _westquant-core
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install latest dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ./_westquant-core
          pip install --upgrade --upgrade-strategy eager -e ".[test]"
          pip check
          pip freeze
      - name: Run tests
        run: pytest tests/ -v
