name: Release to PyPI

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: |
          python -m pip install --upgrade pip
          pip install "qiskit~=2.5.2" pytest
          pip install .
      - run: pytest -q
      - name: Verify Qiskit plugin discovery
        run: |
          python - <<'PY'
          from qiskit.transpiler.preset_passmanagers.plugin import list_stage_plugins
          for stage in ("layout", "routing", "optimization"):
              plugins = list_stage_plugins(stage)
              assert "westquant" in plugins, (stage, plugins)
          PY
      - name: Real sequential smoke search
        run: |
          westquant-qiskit-search --suite smoke --search sequential --beam-width 2 --output /tmp/wq-seq
          test -f /tmp/wq-seq/manifest.json

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade build
      - run: python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
